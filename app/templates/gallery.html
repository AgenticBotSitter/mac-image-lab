<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery · Mac Image Lab</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="gallery-page"><nav><a class="brand" href="/">Mac Image Lab</a><a href="/gallery">Gallery</a></nav><header class="gallery-head"><div><p class="eyebrow">IMAGE LIBRARY</p><h1>Gallery</h1><p>{{ runs|length }} images · {{ families|length }} families · image-first browsing</p></div><div class="density"><button data-density="large">Large</button><button data-density="medium" class="active">Medium</button><button data-density="compact">Compact</button></div></header><main class="gallery-main"><div class="gallery-tools"><input id="search" placeholder="Search prompts, models, folders"><select id="model-filter"><option value="">All models</option>{% for id,model in models.items() %}<option value="{{ model.label }}">{{ model.label }}</option>{% endfor %}</select><select id="view-filter"><option value="all">All images</option><option value="family">Group by family</option></select></div><div id="image-grid" class="image-grid medium">{% for run in runs %}{% if run.output %}<a class="image-tile" href="/runs/{{ run.run_id }}" data-search="{{ run.prompt|lower }} {{ run.model_label|lower }} {{ run.library_folder|default('')|lower }}" data-model="{{ run.model_label }}" data-family="{{ run.family_id }}"><img src="/runs/{{ run.run_id }}/download/output.png" alt="{{ run.title }}"><span class="tile-meta"><b>{{ run.model_label }}</b><small>{{ run.title }}</small></span></a>{% endif %}{% endfor %}</div></main><script>const grid=document.getElementById('image-grid'),search=document.getElementById('search'),model=document.getElementById('model-filter'),view=document.getElementById('view-filter');document.querySelectorAll('[data-density]').forEach(b=>b.onclick=()=>{grid.className='image-grid '+b.dataset.density;document.querySelectorAll('[data-density]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function filter(){let seen=new Set();document.querySelectorAll('.image-tile').forEach(t=>{let ok=t.dataset.search.includes(search.value.toLowerCase())&&(!model.value||t.dataset.model===model.value);if(view.value==='family'&&seen.has(t.dataset.family))ok=false;if(ok&&view.value==='family')seen.add(t.dataset.family);t.hidden=!ok})}search.oninput=filter;model.onchange=filter;view.onchange=filter;</script></body></html>
